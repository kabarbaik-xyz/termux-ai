name: build-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile-check every source fragment
        run: python3 -m py_compile src/*.py

      - name: Rebuild the single-file artifact
        run: python3 build.py

      - name: Refuse stale artifact
        run: |
          if ! git diff --exit-code -- ai; then
            echo "::error::'ai' is out of date with src/. Run 'python3 build.py' and commit the result."
            exit 1
          fi

      - name: Compile-check the generated artifact
        run: python3 -m py_compile ai

      - name: Run the test suite
        env:
          HOME: /tmp/aici-home
        run: |
          mkdir -p "$HOME"
          python3 tests/test_security.py
