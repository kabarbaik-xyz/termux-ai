name: build-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # v5 runs on the node24 runtime (v4 used the deprecated node20).
      - uses: actions/checkout@v5

      # No actions/setup-python needed: ubuntu-latest ships Python 3.12+,
      # which is plenty for this stdlib-only project (requires 3.8+).
      # Skipping it also avoids another node20-deprecated action.

      - name: Show Python version
        run: python3 --version

      - name: Compile-check every source fragment
        run: python3 -m py_compile src/*.py

      - name: Rebuild the single-file artifact
        run: python3 build.py

      - name: Refuse stale artifact
        run: |
          if ! git diff --exit-code -- ai; then
            echo "::error::'ai' is out of date with src/. Run 'python3 build.py' and commit the result."
            exit 1
          fi

      - name: Compile-check the generated artifact
        run: python3 -m py_compile ai

      - name: Run the test suite
        env:
          HOME: /tmp/aici-home
        run: |
          mkdir -p "$HOME"
          python3 -m unittest discover -s tests -p 'test_*.py' -v
